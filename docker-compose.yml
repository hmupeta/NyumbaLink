services:
  db:
    image: postgres:16  # was postgis — DEFERRED to Phase 2
    environment:
      POSTGRES_DB: nyumbalink
      POSTGRES_USER: nyumbalink
      POSTGRES_PASSWORD: nyumbalink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyumbalink -d nyumbalink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
