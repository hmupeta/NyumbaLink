name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: nyumbalink
          POSTGRES_USER: nyumbalink
          POSTGRES_PASSWORD: nyumbalink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyumbalink"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SECRET_KEY: ci-secret-key
      DB_NAME: nyumbalink
      DB_USER: nyumbalink
      DB_PASSWORD: nyumbalink
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # GDAL step removed — PostGIS deferred to Phase 2
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations in sync
        run: python manage.py makemigrations --check --dry-run
      - name: Django check
        run: python manage.py check
      - name: Tests
        run: python manage.py test apps
