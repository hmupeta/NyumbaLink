databases:
  - name: nyumbalink-db
    databaseName: nyumbalink
    user: nyumbalink
    plan: free

services:
  # ------------------------------------------------------------
  # DJANGO BACKEND
  # ------------------------------------------------------------
  - type: web
    name: nyumbalink-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nyumbalink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WEB_CONCURRENCY
        value: 2

  # ------------------------------------------------------------
  # REACT FRONTEND
  # ------------------------------------------------------------
  - type: web
    name: nyumbalink-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://nyumbalink-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
